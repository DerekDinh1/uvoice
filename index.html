<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uvoice</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131417" />
    <!-- Paint the correct background before the bundle loads, to avoid a flash. -->
    <style>
      html {
        background: #f2f1ec;
      }
      html.dark {
        background: #131417;
      }
    </style>
    <!-- Apply the saved theme before React mounts, so there is no flash of the
         wrong theme on load. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('uvoice:theme');
          var mode = raw ? JSON.parse(raw).state.mode : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore and fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
